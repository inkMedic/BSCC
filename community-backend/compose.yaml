services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${COMMUNITY_DB_PASSWORD:-community}
      POSTGRES_DB: community_dev
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["community_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community_dev"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["community_redis:/data"]
volumes:
  community_pg:
  community_redis:
