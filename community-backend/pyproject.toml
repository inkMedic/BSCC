[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["community_backend*"]

[project]
name = "ballistica-community-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy[asyncio]", "psycopg[binary]", "alembic", "redis", "argon2-cffi", "pydantic-settings"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "httpx", "websockets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
