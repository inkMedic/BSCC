  # ################################################################################
  # #                                                                              #
  # #                                    Flatpak                                   #
  # #                                                                              #
  # ################################################################################

  release_flatpak_gui_debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Cache Flatpak data
        id: cache-flatpak-sdk
        uses: actions/cache@v5
        env:
          cache-name: cache-flatpak
        with:
          path: |
            ~/.local/share/flatpak
            .cache/flatpak/flatpak-builder
            .cache/flatpak/repo
            !.cache/flatpak/flatpak-builder/build
          key: ${{ runner.os }}-${{runner.arch}}-${{ env.cache-name }}-${{ hashFiles('pconfig/flatpak/net.froemling.bombsquad.yml', 'pconfig/flatpak/python-build-env.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{runner.arch}}-${{ env.cache-name }}-
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y flatpak flatpak-builder
      - name: Install flatpak build dependencies
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          make flatpak-deps

      - name: Make the build
        run: |
          make flatpak-linux
          mv build/flatpak/bombsquad.flatpak bombsquad_${{ matrix.arch }}.flatpak
      - name: Upload the build
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: bombsquad_${{ matrix.arch }}.flatpak

  ################################################################################
  #                                                                              #
  #                                   Flathub                                    #
  #                           (only runs on upstream)                            #
  ################################################################################

  release_flatpak_prebuilt_inputs:
    if: ${{ github.repository_owner == 'efroemling' || github.repository_owner == 'Loup-Garou911XD' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      # Flathub builds take the code from git at this tag; this archive
      # carries the rest (what a network-less build can't fetch, plus
      # this release's metadata entry). See pconfig/flatpak/README.md.
      - name: Add flatpak release metadata
        run: tools/pcommand flatpak_add_release "${GITHUB_REF_NAME}"
      - name: Pack the flatpak prebuilt inputs
        run: make flatpak-prebuilt-inputs
      - name: Upload the prebuilt inputs
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: build/flatpak/bombsquad_prebuilt_inputs.tar.xz

  release_generate_flathub_manifest:
    if: ${{ github.repository_owner == 'efroemling' || github.repository_owner == 'Loup-Garou911XD' }}
    runs-on: ubuntu-latest
    needs: release_flatpak_prebuilt_inputs
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup build env
        uses: ./.github/actions/bombsquad_build_env
      - name: Configure flathub repo clone
        run: |
          git config --global user.email "90267658+Loup-Garou911XD@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          mkdir -p build/flathub
          git clone https://github.com/${{ github.repository_owner }}/flathub build/flathub
          cd build/flathub
          git fetch origin net.froemling.bombsquad
          git checkout -b net.froemling.bombsquad FETCH_HEAD
      - name: Generate Flathub manifest
        env:
          # (Authenticates its GitHub API call; anonymous ones hit the
          # shared runner rate limit.)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make flatpak-generate-flathub-manifest
      - name: Push changes
        env:
          FLATHUB_PUSH_PAT: ${{ secrets.FLATHUB_PUSH_PAT }}
        run: |
          cd build/flathub
          git remote set-url origin \
            https://x-access-token:${FLATHUB_PUSH_PAT}@github.com/${{ github.repository_owner }}/flathub.git
          git add -A
          git commit -m "Update flathub manifest to release ${{ github.ref_name }}"
          git push origin net.froemling.bombsquad

  ################################################################################
  #                                                                              #
  #                              Community Mobile                               #
  #                                                                              #
  ################################################################################

  release_community_ios:
    name: Community iOS (unsigned ARM64 IPA)
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Set up build environment
        run: make env VENV_LOCK=pconfig/requirements_build_lock.txt
      - name: Build unsigned iOS IPA
        env:
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
        run: |
          args=(--sdk iphoneos --configuration Release)
          if [[ -n "${COMMUNITY_API_URL:-}" ]]; then
            args+=(--api-url "$COMMUNITY_API_URL")
          fi
          .venv/bin/python tools/community-ios/build.py "${args[@]}"
      - name: Upload iOS package to Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: artifacts/ios/ballistica-community-arm64-unsigned.ipa,artifacts/ios/ballistica-community-arm64-unsigned.json

  release_community_android:
    name: Community Android (ARM64 debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
      - name: Set up Python and generate sources
        run: |
          make env VENV_LOCK=pconfig/requirements_build_lock.txt
          make codegen VENV_LOCK=pconfig/requirements_build_lock.txt
      - name: Prepare verified community assets
        run: .venv/bin/python tools/community-android/ensure-assets.py
      - name: Build Android native dependencies
        run: |
          for stage in sources python audio stage; do
            .venv/bin/python -u tools/community-android/dependencies.py "$stage"
          done
      - name: Build debug APK
        env:
          COMMUNITY_API_URL: ${{ vars.COMMUNITY_API_URL }}
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p build/community-downloads build/community-deps
          curl --fail --location --retry 2 \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip \
            -o build/community-downloads/gradle-8.13-bin.zip
          unzip -q -n build/community-downloads/gradle-8.13-bin.zip -d build/community-deps
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > ballisticakit-android/local.properties
          build/community-deps/gradle-8.13/bin/gradle --no-daemon -p ballisticakit-android :BallisticaKit:assembleDebug
      - name: Verify APK
        run: |
          mkdir -p artifacts/android
          cp ballisticakit-android/BallisticaKit/build/outputs/apk/debug/BallisticaKit-debug.apk \
            artifacts/android/ballistica-community-arm64-debug.apk
          sha256sum artifacts/android/ballistica-community-arm64-debug.apk > artifacts/android/apk-sha256.txt
          .venv/bin/python tools/community-android/verify-apk.py \
            artifacts/android/ballistica-community-arm64-debug.apk \
            > artifacts/android/apk-verification.json
      - name: Upload Android package to Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBody: true
          artifacts: artifacts/android/ballistica-community-arm64-debug.apk,artifacts/android/apk-sha256.txt,artifacts/android/apk-verification.json
